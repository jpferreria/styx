[package]
name = "styx-kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "FileSystemSyncAccessHandle",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "Performance"
] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
bitflags = "2.4"
thiserror = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
